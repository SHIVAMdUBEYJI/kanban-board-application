
server:
  port: 8082
  error:
    include-message: always
spring:
  application:
    name: kanban-board-service
  rabbitmq:
    host: rabbitmq-container
  data:
    mongodb:
      uri: mongodb://mongo:27017/kanban_database?createIfNotExists=true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server-service:8761/eureka
