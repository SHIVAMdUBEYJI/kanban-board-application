<div class="home">
	<section class="home-hero">
		<div class="about_content">
			<div class="hero_image">
				<div *ngIf="!isLoggedIn; else elseBlock">
					<h1>My Work Planner brings all your tasks, teammates, and tools together</h1>
					<p>Collaborate, manage projects, and reach new productivity peaks.
						<br>
						Keep everything in the same place—even if your team isn’t.
					</p>
					<div class="hero_buttons">
						<button class="button button--primary" color="primary" mat-raised-button routerLink="register">Sign up -
							it's free!
						</button>
						<button class="button button--secondary" color="accent" mat-raised-button routerLink="login">Log in</button>
					</div>
				</div>
				<ng-template #elseBlock class="hero_image">
					<h1>
						Hello {{firstName}} !
					</h1>
					<p>
						Welcome to Kanban Board
						<br>
						Go to your Boards and assign your tasks
					</p>
					<div class="hero_buttons">
						<button class="button button--primary" color="primary" mat-raised-button routerLink="/dashboard">Boards
						</button>
					</div>
				</ng-template>

			</div>
			<div class="hero_background">
				<img
					alt="hero image"
					src="https://res.cloudinary.com/dduwkdctl/image/upload/v1674188551/Kanban%20Project/home_main_jbkz3d.webp"
					style="width: 60%">
			</div>
		</div>
	</section>
</div>
